name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create Docker network
        run: docker network create se-methods

      - name: Run MongoDB
        run: docker run -d --name mongo-dbserver --network se-methods mongo:latest

      - name: Compile
        run: mvn compile

      - name: Build Docker image
        run: docker build -t devopsimage .

      - name: Run application
        run: docker run --name devopscontainer --network se-methods -d devopsimage

      - name: Docker logs
        run: docker logs devopscontainer
